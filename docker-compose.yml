services:
  myledger:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myledger
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Seoul
      - PORT=8000
      - DB_PATH=/app/data/db.sqlite3
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
