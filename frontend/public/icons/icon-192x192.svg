      <path d="M420 210 L428 222 L442 228 L428 234 L420 248 L414 234 L400 228 L414 222 Z"/>
      <path d="M170 140 L178 152 L192 158 L178 164 L170 178 L164 164 L150 158 L164 152 Z"/>
