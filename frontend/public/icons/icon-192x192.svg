    <rect x="155" y="425" width="46" height="56" rx="18" fill="#C83A46"/>
    <rect x="320" y="425" width="46" height="56" rx="18" fill="#C83A46"/>
    <path d="M436 350 C458 350 466 328 452 318 C440 310 422 316 420 330 C418 344 428 350 436 350"
