{{define "content"}}
<div class="card">
    <div class="card-header">
        <div class="icon icon-warning">✏️</div>
        <h2>거래 수정</h2>
    </div>
    
    <form action="/transactions/{{.Transaction.ID}}" method="POST">
        <div class="form-row">
            <div class="form-group">
                <label>카드사 *</label>
                <select name="card_id" required>
                    {{range .Cards}}
                    <option value="{{.ID}}" {{if eq .ID $.Transaction.CardID}}selected{{end}}>{{.Name}}</option>
                    {{end}}
                </select>
            </div>
            <div class="form-group">
                <label>날짜 *</label>
                <input type="date" name="transaction_date" value="{{formatDate .Transaction.TransactionDate}}" required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>금액 (원) *</label>
                <input type="text" name="amount" value="{{.Transaction.Amount}}" required>
            </div>
            <div class="form-group">
                <label>사용내역 *</label>
                <input type="text" name="description" value="{{.Transaction.Description}}" required>
            </div>
        </div>
        
        <div class="form-group">
            <label>카테고리</label>
            <select name="category_id">
                <option value="">선택 안함</option>
                {{range .Categories}}
                <option value="{{.ID}}" {{if and $.Transaction.CategoryID (eq .ID (deref $.Transaction.CategoryID))}}selected{{end}}>{{.Name}}</option>
                {{end}}
            </select>
        </div>
        
        <div class="form-group">
            <label style="display: flex; align-items: center; cursor: pointer;">
                <input type="checkbox" name="is_installment" value="1" id="isInstallment" {{if eq .Transaction.IsInstallment 1}}checked{{end}}>
                <span>할부 결제</span>
            </label>
        </div>
        
        <div id="installmentFields" style="display: {{if eq .Transaction.IsInstallment 1}}block{{else}}none{{end}}; padding: 20px; background: var(--gray-50); border-radius: 12px; margin-bottom: 20px;">
            <div class="form-row">
                <div class="form-group">
                    <label>할부 개월</label>
                    <input type="number" name="installment_months" value="{{if .Transaction.InstallmentMonths}}{{deref .Transaction.InstallmentMonths}}{{end}}" min="2" max="36">
                </div>
                <div class="form-group">
                    <label>현재 회차</label>
                    <input type="number" name="installment_current" value="{{if .Transaction.InstallmentCurrent}}{{deref .Transaction.InstallmentCurrent}}{{else}}1{{end}}" min="1">
                </div>
                <div class="form-group">
                    <label>원금 총액</label>
                    <input type="text" name="original_amount" value="{{if .Transaction.OriginalAmount}}{{deref .Transaction.OriginalAmount}}{{end}}">
                </div>
            </div>
        </div>
        
        <div style="display: flex; gap: 12px;">
            <button type="submit" class="btn btn-primary">✅ 저장</button>
            <a href="/transactions" class="btn btn-secondary">취소</a>
        </div>
    </form>
</div>

<script>
document.getElementById('isInstallment').addEventListener('change', function() {
    document.getElementById('installmentFields').style.display = this.checked ? 'block' : 'none';
});
</script>
{{end}}
