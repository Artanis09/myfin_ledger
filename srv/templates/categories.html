{{define "content"}}
<div class="card">
    <h2>🏷️ 카테고리 관리</h2>
    <p class="text-muted" style="margin-bottom: 16px;">키워드를 설정하면 거래내역이 자동으로 분류됩니다. (쉼표로 구분)</p>
    
    {{if .Categories}}
    <table>
        <tr>
            <th>카테고리</th>
            <th>키워드</th>
            <th></th>
        </tr>
        {{range .Categories}}
        <tr>
            <form action="/categories/{{.ID}}" method="POST">
                <td><input type="text" name="name" value="{{.Name}}" style="width: 120px;"></td>
                <td><input type="text" name="keywords" value="{{.Keywords}}" placeholder="키워드1,키워드2"></td>
                <td class="actions">
                    <button type="submit" class="btn btn-secondary btn-sm">저장</button>
            </form>
                    <form action="/categories/{{.ID}}/delete" method="POST" onsubmit="return confirm('삭제하시겠습니까?');">
                        <button type="submit" class="btn btn-danger btn-sm">삭제</button>
                    </form>
                </td>
        </tr>
        {{end}}
    </table>
    {{else}}
    <p class="text-muted">등록된 카테고리가 없습니다.</p>
    {{end}}
</div>

<div class="card">
    <h2>➕ 새 카테고리 등록</h2>
    <form action="/categories" method="POST">
        <div class="form-row">
            <div class="form-group">
                <label>카테고리 이름</label>
                <input type="text" name="name" placeholder="식비" required>
            </div>
            <div class="form-group">
                <label>키워드 (쉼표 구분)</label>
                <input type="text" name="keywords" placeholder="배달의민족,요기요,식당">
            </div>
        </div>
        <button type="submit" class="btn btn-primary">등록</button>
    </form>
</div>
{{end}}
